name: Radar Locate Me Recenter

on:
  push:
    branches:
      - fix/radar-locate-me-recenter

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[radar-hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: partysafari/package-lock.json

      - name: Patch Safari Radar recenter behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('partysafari/src/components/radar/SafariRadarExperience.tsx')
          text = path.read_text()
          old = '''        traceSetState("userLocation", 472, location);
        setUserLocation(location);
        traceSetState("geoError", 474, null);
        setGeoError(null);'''
          new = '''        traceSetState("userLocation", 472, location);
        setUserLocation(location);
        setSelectedCity("nearby");
        setViewMode("map");
        setFocusTarget({ lat: location.lat, lng: location.lng, zoom: Math.max(mapZoom, 14) });
        traceSetState("geoError", 474, null);
        setGeoError(null);'''
          if old not in text:
              raise SystemExit('Expected Radar geolocation success block was not found')
          text = text.replace(old, new, 1)
          text = text.replace('  }, []);\n\n  useEffect(() => {\n    logEffectRun("request-geolocation-on-mount"', '  }, [mapZoom]);\n\n  useEffect(() => {\n    logEffectRun("request-geolocation-on-mount"', 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        working-directory: partysafari
        run: npm ci

      - name: Build
        working-directory: partysafari
        run: npm run build

      - name: Commit validated hotfix
        run: |
          rm .github/workflows/radar-locate-me-recenter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partysafari/src/components/radar/SafariRadarExperience.tsx .github/workflows/radar-locate-me-recenter.yml
          git commit -m "fix: recenter Safari Radar on Locate Me [radar-hotfix-applied]"
          git push origin HEAD:fix/radar-locate-me-recenter
