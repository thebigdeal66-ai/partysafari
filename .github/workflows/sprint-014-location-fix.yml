import { useCallback, useSyncExternalStore } from "react";

export type GeoPoint = {
  lat: number;
  lng: number;
};

export type UserLocationStatus = "loading" | "ready" | "denied" | "unavailable" | "error";

type LocationSnapshot = {
  location: GeoPoint | null;
  status: UserLocationStatus;
  error: string | null;
  source: "live" | "cache" | null;
};

type CachedLocation = GeoPoint & {
  savedAt: number;
};

const CACHE_KEY = "partysafari:last-user-location";
const CACHE_MAX_AGE_MS = 15 * 60 * 1000;

let snapshot: LocationSnapshot = {
  location: null,
  status: "loading",
  error: null,
  source: null,
};
let watchId: number | null = null;
const listeners = new Set<() => void>();

function emit(next: LocationSnapshot) {
  snapshot = next;
  for (const listener of listeners) listener();
}

function readCachedLocation(): GeoPoint | null {
  try {
    const raw = window.localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const cached = JSON.parse(raw) as CachedLocation;
    if (
      !Number.isFinite(cached.lat) ||
      !Number.isFinite(cached.lng) ||
      !Number.isFinite(cached.savedAt) ||
      Date.now() - cached.savedAt > CACHE_MAX_AGE_MS
    ) {
      window.localStorage.removeItem(CACHE_KEY);
      return null;
    }
    return { lat: cached.lat, lng: cached.lng };
  } catch {
    return null;
  }
}

function saveLocation(location: GeoPoint) {
  try {
    window.localStorage.setItem(CACHE_KEY, JSON.stringify({ ...location, savedAt: Date.now() }));
  } catch {
    // Location still works when storage is blocked.
  }
}

function handlePosition(position: GeolocationPosition) {
  const location = {
    lat: position.coords.latitude,
    lng: position.coords.longitude,
  };
  saveLocation(location);
  emit({ location, status: "ready", error: null, source: "live" });
}

function handlePositionError(error: GeolocationPositionError) {
  const cached = snapshot.location || readCachedLocation();
  const status: UserLocationStatus = error.code === error.PERMISSION_DENIED ? "denied" : "error";
  emit({
    location: cached,
    status: cached ? "ready" : status,
    error:
      error.code === error.PERMISSION_DENIED
        ? "Location permission is off. Enable it to see accurate nearby distances."
        : "Your location could not be determined right now.",
    source: cached ? "cache" : null,
  });
}

function startTracking() {
  if (typeof window === "undefined" || watchId !== null) return;
  if (!("geolocation" in navigator)) {
    emit({ location: null, status: "unavailable", error: "Location is not supported on this device.", source: null });
    return;
  }

  const cached = readCachedLocation();
  if (cached) emit({ location: cached, status: "ready", error: null, source: "cache" });

  watchId = navigator.geolocation.watchPosition(handlePosition, handlePositionError, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 120000,
  });
}

function stopTracking() {
  if (watchId !== null && typeof navigator !== "undefined" && "geolocation" in navigator) {
    navigator.geolocation.clearWatch(watchId);
  }
  watchId = null;
}

function subscribe(listener: () => void) {
  listeners.add(listener);
  startTracking();
  return () => {
    listeners.delete(listener);
    if (listeners.size === 0) stopTracking();
  };
}

function getSnapshot() {
  return snapshot;
}

const serverSnapshot: LocationSnapshot = { location: null, status: "loading", error: null, source: null };

export function useUserLocation() {
  const state = useSyncExternalStore(subscribe, getSnapshot, () => serverSnapshot);

  const refresh = useCallback(() => {
    stopTracking();
    emit({ ...snapshot, status: snapshot.location ? "ready" : "loading", error: null });
    startTracking();
  }, []);

  return { ...state, refresh };
}
''')

